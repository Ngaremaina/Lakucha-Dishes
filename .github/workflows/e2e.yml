# Full-stack smoke test: builds the real Spring Boot backend (with
# SPRING_PROFILES_ACTIVE=e2e — FakeDarajaClient instead of a real Safaricom call, plus a
# seeded product so the frontend has something to browse/buy) and drives the real Vite
# frontend with Playwright through register -> browse -> cart -> checkout -> pay.
name: E2E smoke test

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lakucha
          POSTGRES_USER: lakucha
          POSTGRES_PASSWORD: lakucha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lakucha -d lakucha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: backend/pom.xml

      - name: Build backend jar
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Start backend (e2e profile)
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: e2e
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/lakucha
          SPRING_DATASOURCE_USERNAME: lakucha
          SPRING_DATASOURCE_PASSWORD: lakucha
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          JWT_SECRET_KEY: e2e-test-secret-key-e2e-test-secret-key
        run: |
          nohup java -jar target/lakucha-backend-*.jar > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become healthy in time"
          cat backend.log
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke test
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-log
          path: backend/backend.log
